name: Daily Auto-Job-Applier

on:
  schedule:
    # Runs at 09:00 IST (03:30 UTC) daily — adjust cron if you need a different timezone
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
      JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run Auto-Job-Applier
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
        run: |
          python -m jab --email $JOBAUTO_EMAIL --apply --headless
