name: Daily Auto-Job-Applier

on:
  schedule:
    # Runs at 09:00 IST (03:30 UTC) daily — adjust cron if you need a different timezone
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
      JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prepare browser storage state
        env:
          JOBAUTO_STORAGE_STATE: ${{ secrets.JOBAUTO_STORAGE_STATE }}
        run: |
          mkdir -p .auth
          if [ -n "$JOBAUTO_STORAGE_STATE" ]; then
            printf '%s' "$JOBAUTO_STORAGE_STATE" > .auth/storage_state.json
            echo "[INFO] Prepared .auth/storage_state.json from JOBAUTO_STORAGE_STATE"
          else
            rm -f .auth/storage_state.json
            echo "[WARN] JOBAUTO_STORAGE_STATE is not set; running without a saved browser session"
          fi

      - name: Validate browser storage state
        run: |
          if [ -f .auth/storage_state.json ]; then
            python -c 'import json; from pathlib import Path; path = Path(".auth/storage_state.json"); data = json.loads(path.read_text()); cookies = len(data.get("cookies", [])); origins = len(data.get("origins", [])); print(f"[INFO] storage_state present: {path}"); print(f"[INFO] cookies={cookies} origins={origins}")'
          else
            echo "[WARN] .auth/storage_state.json is missing"
          fi

      - name: Ensure NLTK resources
        run: |
          python -m nltk.downloader punkt punkt_tab wordnet

      - name: Train model if missing
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
        run: |
          # Train only if the model file is absent for this email
          MODEL_DIR="jab/data/$JOBAUTO_EMAIL"
          MODEL_PATH="$MODEL_DIR/model.keras"
          if [ ! -f "$MODEL_PATH" ]; then
            echo "Model not found at $MODEL_PATH — training now"
            python -m jab --email $JOBAUTO_EMAIL --train
          else
            echo "Model exists — skipping training"
          fi

      - name: Run Auto-Job-Applier
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
          JOBAUTO_STORAGE_STATE_PATH: .auth/storage_state.json
        run: |
          xvfb-run -a python -m jab --email $JOBAUTO_EMAIL --apply --filters
