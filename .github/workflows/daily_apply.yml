name: Daily Auto-Job-Applier

on:
  schedule:
    # Runs at 09:00 IST (03:30 UTC) daily — adjust cron if you need a different timezone
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
      JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prepare browser storage state
        env:
          JOBAUTO_STORAGE_STATE: ${{ secrets.JOBAUTO_STORAGE_STATE }}
        run: |
          mkdir -p .auth
          if [ -n "$JOBAUTO_STORAGE_STATE" ]; then
            printf '%s' "$JOBAUTO_STORAGE_STATE" > .auth/storage_state.json
          else
            rm -f .auth/storage_state.json
          fi

      - name: Ensure NLTK resources
        run: |
          python - <<'PY'
          import nltk
          for pkg in ['punkt', 'punkt_tab', 'wordnet']:
              try:
                  if pkg == 'wordnet':
                      nltk.data.find('corpora/wordnet')
                  else:
                      nltk.data.find(f'tokenizers/{pkg}')
              except LookupError:
                  nltk.download(pkg, quiet=True)
          PY

      - name: Train model if missing
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
        run: |
          # Train only if the model file is absent for this email
          MODEL_DIR="jab/data/$JOBAUTO_EMAIL"
          MODEL_PATH="$MODEL_DIR/model.keras"
          if [ ! -f "$MODEL_PATH" ]; then
            echo "Model not found at $MODEL_PATH — training now"
            python -m jab --email $JOBAUTO_EMAIL --train
          else
            echo "Model exists — skipping training"
          fi

      - name: Run Auto-Job-Applier
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
          JOBAUTO_STORAGE_STATE_PATH: .auth/storage_state.json
        run: |
          xvfb-run -a python -m jab --email $JOBAUTO_EMAIL --apply
