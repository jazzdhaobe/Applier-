name: Daily Auto-Job-Applier
permissions:
  contents: read
  actions: read

on:
  schedule:
    # Runs at 09:00 IST (03:30 UTC) daily — adjust cron if you need a different timezone
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
      JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
      JOBAUTO_NUMBER: "50"
      JOBAUTO_EXPERIENCE: "2"
      JOBAUTO_CI: "1"
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prepare browser storage state
        env:
          JOBAUTO_STORAGE_STATE: ${{ secrets.JOBAUTO_STORAGE_STATE }}
        run: |
          mkdir -p .auth
          if [ -n "$JOBAUTO_STORAGE_STATE" ]; then
            printf '%s' "$JOBAUTO_STORAGE_STATE" > .auth/storage_state.json
            echo "[INFO] Prepared .auth/storage_state.json from JOBAUTO_STORAGE_STATE"
          elif [ -f .auth/storage_state.json ]; then
            echo "[INFO] Using existing .auth/storage_state.json"
          else
            echo "[WARN] No saved session file available; will fall back to password login if needed."
          fi

      - name: Validate browser storage state when present
        run: |
          if [ -f .auth/storage_state.json ]; then
            echo "[INFO] Validating .auth/storage_state.json"
            python - <<'PY'
              import json
              from pathlib import Path

              path = Path('.auth/storage_state.json')
              data = json.loads(path.read_text())
              cookies = data.get('cookies', [])
              origins = data.get('origins', [])
              naukri = [c for c in cookies if 'naukri' in c.get('domain', '')]
              print(f"[INFO] storage_state present: {path}")
              print(f"[INFO] cookies={len(cookies)} origins={len(origins)} naukri_cookies={len(naukri)}")
              if len(naukri) < 3:
                  print('[WARN] storage_state has too few Naukri cookies; it may not authenticate.')
              PY
          else
            echo "[INFO] No .auth/storage_state.json to validate; continuing with password login fallback."
          fi

      - name: Ensure NLTK resources
        run: |
          python -m nltk.downloader punkt punkt_tab wordnet

      - name: Train model if missing
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
        run: |
          # Train only if the model file is absent for this email
          MODEL_DIR="jab/data/$JOBAUTO_EMAIL"
          MODEL_PATH="$MODEL_DIR/model.keras"
          if [ ! -f "$MODEL_PATH" ]; then
            echo "Model not found at $MODEL_PATH — training now"
            python -m jab --email $JOBAUTO_EMAIL --train
          else
            echo "Model exists — skipping training"
          fi

      - name: Verify Naukri login (session reuse)
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
          JOBAUTO_STORAGE_STATE_PATH: .auth/storage_state.json
        run: |
          xvfb-run -a python -u -m jab --email $JOBAUTO_EMAIL --verify-login

      - name: Run Auto-Job-Applier
        # Same as local: python -m jab --email YOU --apply --filters --password PASS
        # Password and session come from secrets; xvfb provides a display on Linux.
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
          JOBAUTO_STORAGE_STATE_PATH: .auth/storage_state.json
        run: |
          xvfb-run -a python -u -m jab --email "$JOBAUTO_EMAIL" --apply --filters

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-debug-screenshots
          path: |
            login_failed.png
            login_exception.png
            login_access_denied.png
            login_form_missing.png
            apply_failed_*.png
          if-no-files-found: ignore
