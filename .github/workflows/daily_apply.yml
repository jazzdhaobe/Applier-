name: Daily Auto-Job-Applier
permissions:
  contents: read
  actions: read

on:
  schedule:
    # Runs at IST times (GitHub cron uses UTC): IST = UTC + 5:30
    # 07:00 IST => 01:30 UTC
    - cron: '30 1 * * *'
    # 09:00 IST => 03:30 UTC
    - cron: '30 3 * * *'
    # 12:00 IST => 06:30 UTC
    - cron: '30 6 * * *'
    # 15:00 IST => 09:30 UTC
    - cron: '30 9 * * *'
    # 17:00 IST => 11:30 UTC
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm manual run'
        required: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
      JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
      JOBAUTO_NUMBER: "30"
      JOBAUTO_EXPERIENCE: "2"
      JOBAUTO_JOBAGE: "7"
      JOBAUTO_CI: "1"
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prepare browser storage state
        env:
          JOBAUTO_STORAGE_STATE: ${{ secrets.JOBAUTO_STORAGE_STATE }}
        run: |
          mkdir -p .auth
          if [ -n "$JOBAUTO_STORAGE_STATE" ]; then
            printf '%s' "$JOBAUTO_STORAGE_STATE" > .auth/storage_state.json
            echo "[INFO] Prepared .auth/storage_state.json from JOBAUTO_STORAGE_STATE"
          elif [ -f .auth/storage_state.json ]; then
            echo "[INFO] Using existing .auth/storage_state.json"
          else
            echo "[WARN] No saved session file available; will fall back to password login if needed."
          fi

      - name: Validate browser storage state when present
        run: |
          if [ -f .auth/storage_state.json ]; then
            echo "[INFO] Validating .auth/storage_state.json"
            python3 -c "import json; from pathlib import Path; p=Path('.auth/storage_state.json'); d=json.loads(p.read_text()); cookies=d.get('cookies',[]); origins=d.get('origins',[]); naukri=[c for c in cookies if 'naukri' in c.get('domain','')]; print(f'[INFO] storage_state present: {p}'); print(f'[INFO] cookies={len(cookies)} origins={len(origins)} naukri_cookies={len(naukri)}'); print('[WARN] storage_state has too few Naukri cookies; it may not authenticate.' if len(naukri) < 3 else '')"
          else
            echo "[INFO] No .auth/storage_state.json to validate; continuing with password login fallback."
          fi


      - name: Ensure NLTK resources
        run: |
          python -m nltk.downloader punkt punkt_tab wordnet

      - name: Train model if missing
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
        run: |
          # Train only if the model file is absent for this email
          MODEL_DIR="jab/data/$JOBAUTO_EMAIL"
          MODEL_PATH="$MODEL_DIR/model.keras"
          if [ ! -f "$MODEL_PATH" ]; then
            echo "Model not found at $MODEL_PATH — training now"
            python -m jab --email $JOBAUTO_EMAIL --train
          else
            echo "Model exists — skipping training"
          fi

      - name: Verify Naukri login (session reuse)
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
          JOBAUTO_STORAGE_STATE_PATH: .auth/storage_state.json
        run: |
          xvfb-run -a python -u -m jab --email $JOBAUTO_EMAIL --verify-login

      - name: Run Auto-Job-Applier
        id: apply_job_run
        # Use the same flow as local: python -m jab --email YOU --apply
        # This uses the faster direct apply path without the filter panel overhead.
        # The code already skips company-site jobs via _find_apply_button().
        env:
          JOBAUTO_EMAIL: ${{ secrets.JOBAUTO_EMAIL }}
          JOBAUTO_PASSWORD: ${{ secrets.JOBAUTO_PASSWORD }}
          JOBAUTO_STORAGE_STATE_PATH: .auth/storage_state.json
        run: |
          mkdir -p logs
          set -o pipefail
          xvfb-run -a python -u -m jab --email "$JOBAUTO_EMAIL" --apply 2>&1 | tee logs/apply_run.log

      - name: Publish job application summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          log_path = Path("logs/apply_run.log")
          summary_lines = ["## Job application summary", ""]

          if log_path.exists():
              text = log_path.read_text(encoding="utf-8", errors="ignore")
              title_matches = re.findall(r"✅ Applied to \d+/\d+ jobs\. Title='([^']*)'", text)
              final_count_match = re.search(r"✅ Successfully applied to (\d+) jobs!", text)
              final_count_total_match = re.search(r"\[FINAL\] Job application completed\. Applied to (\d+) jobs total\.", text)

              count = 0
              if final_count_match:
                  count = int(final_count_match.group(1))
              elif final_count_total_match:
                  count = int(final_count_total_match.group(1))

              if title_matches:
                  summary_lines.append(f"- Applied jobs: {len(title_matches)}")
                  if count:
                      summary_lines.append(f"- Final count reported: {count}")
                  summary_lines.append("- Titles:")
                  for title in title_matches:
                      cleaned = title.strip()
                      if cleaned:
                          summary_lines.append(f"  - {cleaned}")
              else:
                  summary_lines.append(f"- Applied jobs: {count if count else 0}")
                  summary_lines.append("- Titles: none captured")
          else:
              summary_lines.append("- No application log was generated.")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          else:
              print("\n".join(summary_lines))
          PY

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-debug-screenshots
          path: |
            login_failed.png
            login_exception.png
            login_access_denied.png
            login_form_missing.png
            apply_failed_*.png
          if-no-files-found: ignore
